name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature or change.
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What are you trying to do that's hard or impossible right now?

  - type: input
    id: browser
    attributes:
      label: Browser(s) you use
      placeholder: "Chrome, Firefox..."
