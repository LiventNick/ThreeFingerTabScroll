name: Release

# Publishes a new version to GitHub Releases. To release, push a version tag:
#   git tag v1.1.0
#   git push origin v1.1.0
# Installed copies of the app find the new version on their next update check.
#
# Optional extras that switch on by themselves once configured
# (GitHub > Settings > Secrets and variables > Actions):
#   Code signing (free, SignPath Foundation): variable SIGNPATH_ORGANIZATION_ID + secret SIGNPATH_API_TOKEN
#                                             (see .signpath/README.md)
#   winget updates:                           secret WINGET_TOKEN (see docs/winget.md)
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # needed to create the release and upload files
  actions: read   # lets SignPath fetch the build artifacts it signs

env:
  VPK_VERSION: 1.2.161 # keep in sync with the Velopack package version in ThreeFingerTabScroll.csproj
  SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
  WINGET: ${{ secrets.WINGET_TOKEN != '' }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build
        run: >
          dotnet publish ThreeFingerTabScroll.csproj -c Release -r win-x64 --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:RepositoryUrl=https://github.com/${{ github.repository }}
          -o publish

      # ---- 1. Sign the app's own files (before packaging, so installed and updated copies are signed) ----

      - name: Upload app files for signing
        id: upload-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-unsigned
          path: publish/

      - name: Sign app files
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ThreeFingerTabScroll
          signing-policy-slug: release-signing
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.upload-app.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish-signed

      - name: Use signed app files
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item publish-signed\* publish -Recurse -Force

      # ---- 2. Package with Velopack: Setup.exe (used inside the wizard), portable zip, update packages ----

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      # Lets vpk build a small "delta" update from the previous version. Fails harmlessly on the first release.
      - name: Download previous release
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      - name: Package
        run: >
          vpk pack --packId ThreeFingerTabScroll --packVersion ${{ env.VERSION }} --runtime win-x64
          --packDir publish --mainExe ThreeFingerTabScroll.exe
          --packTitle "Three-Finger Tab Scroll" --packAuthors LiventNick
          --icon assets/app.ico -o releases

      # ---- 3. Sign Velopack's Setup.exe (it runs from inside the wizard below) ----

      - name: Upload Setup.exe for signing
        id: upload-setup
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: setup-unsigned
          path: releases/ThreeFingerTabScroll-win-Setup.exe

      - name: Sign Setup.exe
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ThreeFingerTabScroll
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: setup-signed

      - name: Use signed Setup.exe
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item setup-signed\ThreeFingerTabScroll-win-Setup.exe releases -Force

      # ---- 4. Build the install wizard (Inno Setup) around Setup.exe ----

      - name: Build install wizard
        shell: pwsh
        run: |
          $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem 'C:\Program Files*\Inno Setup*\ISCC.exe' | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=$env:VERSION" installer\ThreeFingerTabScroll.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload wizard for signing
        id: upload-wizard
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wizard-unsigned
          path: releases/ThreeFingerTabScroll-Installer.exe

      - name: Sign wizard
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ThreeFingerTabScroll
          signing-policy-slug: release-signing
          artifact-configuration-slug: wizard
          github-artifact-id: ${{ steps.upload-wizard.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: wizard-signed

      - name: Use signed wizard
        if: env.SIGNING == 'true'
        shell: pwsh
        run: Copy-Item wizard-signed\ThreeFingerTabScroll-Installer.exe releases -Force

      # ---- 5. Publish ----

      - name: Publish GitHub release
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --publish --releaseName "Three-Finger Tab Scroll ${{ env.VERSION }}" --tag ${{ github.ref_name }}
          -o releases

      # People download the wizard; Velopack's one-click Setup.exe is only used inside it, so it's
      # removed from the release (updates don't need it).
      - name: Swap one-click Setup.exe for the install wizard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} releases/ThreeFingerTabScroll-Installer.exe --clobber
          gh release delete-asset ${{ github.ref_name }} ThreeFingerTabScroll-win-Setup.exe --yes

      # ---- 6. winget: send the new version to the Windows Package Manager catalog ----
      # Runs once the package is in winget (first submission is manual) and the WINGET_TOKEN secret is set.

      - name: Update winget package
        if: env.WINGET == 'true'
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ThreeFingerTabScroll-Installer.exe"
          .\wingetcreate.exe update LiventNick.ThreeFingerTabScroll --version $env:VERSION --urls $url --submit --token $env:WINGET_TOKEN
